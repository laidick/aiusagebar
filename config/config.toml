# ai-usagebar config installed by `make config` → ~/.config/ai-usagebar/config.toml
# Reference: vendor/ai-usagebar/config.example.toml

[ui]
# Overview order shown in the macOS menu bar: Claude, Codex, Gemini (Antigravity), OpenCode Go
overview_vendors = ["anthropic", "openai", "antigravity", "opencode-go"]

[anthropic]
enabled = true

[openai]
enabled = true

# Gemini quota comes from Google Antigravity's local server (agy CLI / Antigravity app).
# Google shut Gemini CLI Code Assist OAuth for individual accounts in 2026-06.
[antigravity]
enabled = true

# OpenCode Go is an API-key vendor: export OPENCODE_GO_API_KEY, or set
# api_key = "..." here (the menu bar app's "OpenCode Go key…" action writes it).
[opencode-go]
enabled = true
api_key_env = "OPENCODE_GO_API_KEY"

# Disable defaults we don't need
[zai]
enabled = false

[openrouter]
enabled = false
